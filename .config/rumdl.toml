# rumdl configuration file
#
# https://rumdl.dev/

[global]

exclude = [
    ".git",
    "LICENSES",
    "LICENSE.md"
]

line-length = 120

respect-gitignore = true

[MD004]
style = "dash"

[MD013]
reflow = true
reflow-mode = "normalize"

# GitHub puts the PR's title above the template, so the template starts at level 2.
[per-file-ignores]
".github/pull_request_template.md" = ["MD041"]
