# lefthook configuration
# https://lefthook.dev/configuration/

output:
  - failure
  - summary

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner

    rumdl:
      glob: "*.md"
      run: rumdl check {staged_files}

    go-fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

    go-lint:
      glob: "*.go"
      # only report issues introduced since HEAD, so staged work is checked quickly; every module is linted
      run: scripts/each-module.sh golangci-lint run --new-from-rev=HEAD ./...

    go-mod-tidy:
      glob: "{go.mod,go.sum,go.work,go.work.sum,*.go}"
      run: scripts/each-module.sh go mod tidy -diff

pre-push:
  parallel: false
  commands:
    # CI runs the same scripts, but until branch protection requires it (DL-283) these are the only enforcement: never
    # skip them with --no-verify or LEFTHOOK=0
    go-test:
      files: git ls-files '*.go'
      # every module, on the latest Go with -race and on the minimum Go from go.mod
      run: scripts/check-go-versions.sh

    gowork-off:
      files: git ls-files '*.go' 'go.mod' '*/go.mod'
      # every module on its own, without go.work
      run: scripts/check-gowork-off.sh

    golangci-lint:
      files: git ls-files '*.go'
      run: scripts/each-module.sh golangci-lint run ./...

    govulncheck:
      files: git ls-files '*.go'
      run: scripts/each-module.sh govulncheck ./...

    licenses:
      run: scripts/check-licenses.sh

    deps:
      files: git ls-files 'go.mod' '*/go.mod' 'scripts/check-deps.sh'
      # the dependency budget in docs/contributing/project-layout.md (DL-173)
      run: scripts/check-deps.sh

    markdown:
      files: git ls-files '*.md'
      # every markdown file, so renaming a heading or moving a doc can't break a link in a file that wasn't staged (DL-254)
      run: rumdl check .

commit-msg:
  commands:
    conventional-commit:
      run: |
        head -n1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || {
          echo "Commit message must follow Conventional Commits, e.g. 'feat(scope): summary'" >&2
          exit 1
        }
