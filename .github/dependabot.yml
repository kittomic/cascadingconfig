# Weekly update PRs for the actions and every module's dependencies, grouped, each release only once it's two weeks
# old (DL-283). This repository's own modules are left alone: they're required through replace directives or go.work.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /
      - /format/toml
      - /format/yaml
      - /ociresolver
      - /watch/fsnotify
      - /presets
      - /internal/apicheck
      - /internal/compat
      - /internal/conformance
      - /examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: github.com/kittomic/cascadingconfig*
    groups:
      go:
        patterns: ["*"]
